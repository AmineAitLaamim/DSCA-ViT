seed: 42
project_name: HER2_Classification
experiment_prefix: exp
experiment_name: hybrid

paths:
  data_dir: data
  output_dir: experiments
  train_manifest: null
  val_manifest: null
  test_manifest: null

dataset:
  root: data
  train_dir: train_data_patch
  test_dir: test_data_patch
  class_mapping:
    class_0: 0
    class_1+: 1
    class_2+: 2
    class_3+: 3

  expected_counts:
    train:
      class_0: 3031
      class_1+: 2151
      class_2+: 905
      class_3+: 2710
    test:
      class_0: 758
      class_1+: 538
      class_2+: 226
      class_3+: 678

  image_size: 224
  num_workers: 2
  pin_memory: true
  val_fraction: 0.1

  verify_images: false
  verify_duplicate_content: true

  allowed_extensions:
    - .jpg
    - .jpeg
    - .png
    - .tif
    - .tiff
    - .bmp

classes:
  class_0: 0
  class_1+: 1
  class_2+: 2
  class_3+: 3

model:
  eva_name: eva02_large_patch14_448.mim_m38m_ft_in22k_in1k
  vit_name: vit_base_patch16_224
  convnext_name: convnextv2_nano.fcmae_ft_in1k

  pretrained: true

  eva_dim: 1024
  vit_dim: 768
  convnext_dim: 640

  fusion_dim: 2432
  fusion_hidden_dim: 1024

  dropout: 0.2

  # Memory optimization only
  gradient_checkpointing: true

training:
  epochs: 100

  # Reduced for Colab T4
  batch_size: 2

  # Keeps effective batch size = 32
  gradient_accumulation_steps: 16

  learning_rate: 1.0e-5
  weight_decay: 0.01

  optimizer: adamw

  scheduler: warmup_cosine

  warmup_epochs: 10
  min_learning_rate: 1.0e-7

  amp: true

  gradient_clip_norm: 1.0

  early_stopping_patience: 25

  label_smoothing: 0.1
  mixup_alpha: 0.5

  ema_decay: 0.9999

  monitor_metric: val_loss
  monitor_mode: min

  resume: true

evaluation:
  batch_size: 2
  save_figures: true