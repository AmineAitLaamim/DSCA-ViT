# ============================================================
# UNI-Stain-Attention Configuration — HER2-IHC-40x
# ============================================================
# Frozen UNI feature extractor + H/DAB stain side-information
# fused via stain-conditioned attention pooling over UNI patch
# tokens + MLP head.
#
# Experiment: uni_stain_attn_001
# ============================================================

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------
model:
  backbone: "vit_large_patch16_224"   # UNI (DINOv2, mass100k), frozen
  image_size: 224
  num_classes: 4

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------
dataset:
  name: "HER2-IHC-40x"
  classes:
    - "class_0"
    - "class_1+"
    - "class_2+"
    - "class_3+"
  image_size: 224
  val_fraction: 0.10     # must match the shared split file

# ------------------------------------------------------------
# Experiment
# ------------------------------------------------------------
experiment:
  name: "uni_stain_attn_001"
  seed: 42

# ------------------------------------------------------------
# Training — single stage (UNI frozen forever)
# ------------------------------------------------------------
training:
  epochs: 30
  lr: 1.0e-3
  weight_decay: 0.05
  batch_size: 64           # per GPU
  num_workers: 8
  optimizer: "AdamW"
  amp: true
  label_smoothing: 0.1
  gradient_clip: 1.0
  mixup_alpha: 0.0
  stain_dim: 512
  main_metric: "accuracy"
  debug: false

# ------------------------------------------------------------
# Paths — Toubkal / UM6P (experiment: uni_stain_attn_001)
# ============================================================
# All paths are absolute strings. YAML performs no interpolation.
#
# Workspace root: /home/amine.aitlaamim-ext/projects/DSCA-ViT
# ============================================================
paths:
  data_root: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2"

  # Dataset — already present on Toubkal, not in Git
  train_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/train"
  test_dir:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/test"

  # Experiment artifacts — outside the Git repository
  experiment_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/UNI-Stain-Attention/uni_stain_attn_001"
  checkpoint_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/checkpoints/UNI-Stain-Attention/uni_stain_attn_001"
  log_dir:        "/home/amine.aitlaamim-ext/projects/DSCA-ViT/logs/UNI-Stain-Attention/uni_stain_attn_001"
  results_dir:    "/home/amine.aitlaamim-ext/projects/DSCA-ViT/results/UNI-Stain-Attention/uni_stain_attn_001"

  # Shared WSI-aware split — LOAD ONLY, never regenerate
  split_indices_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/ViT-Baseline/plain_vit_baseline_001/split_indices_wsi.npz"

  # Local UNI checkpoint — no network calls, no HF downloads
  uni_checkpoint_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/pytorch_model.bin"

  # Self-consistent stain stats — computed by UNI-Stain-Attention/precompute_stain_stats.py
  stain_stats_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/code/DSCA-ViT/configs/uni_stain_attn_stain_stats.json"