# ============================================================
# ViT-B16-CORN Configuration — HER2-IHC-40x
# ============================================================
# ViT-B16 backbone + CORN ordinal regression head. Single
# variable change from the proper ViT-B16 baseline: only the
# output layer and loss are changed from standard 4-way
# cross-entropy to CORN ordinal regression (coral-pytorch).
#
# Experiment: vit_b16_corn_001
# ============================================================

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------
model:
  backbone: "vit_base_patch16_224"
  pretrained: true
  num_classes: 4
  image_size: 224

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------
dataset:
  name: "HER2-IHC-40x"
  classes:
    - "class_0"
    - "class_1+"
    - "class_2+"
    - "class_3+"
  image_size: 224
  val_fraction: 0.10     # must match the shared split file

# ------------------------------------------------------------
# Experiment
# ------------------------------------------------------------
experiment:
  name: "vit_b16_corn_001"
  seed: 42

# ------------------------------------------------------------
# Training — 2 stages (identical to proper ViT-B16 baseline)
# ------------------------------------------------------------
training:
  stage1_epochs: 30
  stage2_epochs: 30
  stage1_lr: 1.0e-4
  stage2_backbone_lr: 1.0e-5
  stage2_head_lr: 1.0e-4
  batch_size: 32           # per GPU
  amp: false               # disabled
  label_smoothing: 0.0     # n/a for CORN loss
  weight_decay: 0.0
  gradient_clip: false     # disabled
  num_workers: 8
  optimizer: "Adam"
  main_metric: "accuracy"
  debug: false

# ------------------------------------------------------------
# Paths — Toubkal / UM6P (experiment: vit_b16_corn_001)
# ============================================================
# All paths are absolute strings. YAML performs no interpolation.
#
# Workspace root: /home/amine.aitlaamim-ext/projects/DSCA-ViT
# ============================================================
paths:
  data_root: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2"

  # Dataset — already present on Toubkal, not in Git
  train_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/train"
  test_dir:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/test"

  # Experiment artifacts — outside the Git repository
  experiment_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/ViT-B16-CORN/vit_b16_corn_001"
  checkpoint_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/checkpoints/ViT-B16-CORN/vit_b16_corn_001"
  log_dir:        "/home/amine.aitlaamim-ext/projects/DSCA-ViT/logs/ViT-B16-CORN/vit_b16_corn_001"
  results_dir:    "/home/amine.aitlaamim-ext/projects/DSCA-ViT/results/ViT-B16-CORN/vit_b16_corn_001"

  # Shared WSI-aware split — LOAD ONLY, never regenerate
  split_indices_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/ViT-Baseline/plain_vit_baseline_001/split_indices_wsi.npz"