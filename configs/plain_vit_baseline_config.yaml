# ============================================================
# Plain ViT-B16 Baseline Configuration
# Reproduces the 95.02% baseline on the HER2-IHC-40x dataset
# ============================================================
# This config EXACTLY matches the original Colab notebook
# (model_HER2_ViT.ipynb):
#   - Optimizer: Adam (no weight decay)
#   - Loss: plain CrossEntropyLoss (no label smoothing)
#   - Batch size: 32
#   - Validation: on the official TEST set
#   - No AMP, no gradient clipping, no mixup
# ============================================================

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------
model:
  backbone: "vit_base_patch16_224"
  pretrained: true
  num_classes: 4
  image_size: 224

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------
dataset:
  name: "HER2-IHC-40x"
  classes:
    - "class_0"
    - "class_1+"
    - "class_2+"
    - "class_3+"
  image_size: 224
  val_fraction: 0.0          # 0.0 = validate on the official TEST set (as in the notebook)
  val_seed: 42

# ------------------------------------------------------------
# Training — Stages (original 2-stage baseline protocol)
# ------------------------------------------------------------
stage1:
  epochs: 30
  lr: 1.0e-4          # Head-only LR (backbone frozen)
  freeze: ["backbone"]

stage2:
  epochs: 30
  backbone_lr: 1.0e-5  # Slow backbone adaptation
  head_lr: 1.0e-4      # Faster head
  freeze: []

# ------------------------------------------------------------
# Training — General
# ------------------------------------------------------------
training:
  batch_size: 32            # Matches the Colab notebook exactly
  num_workers: 8
  optimizer: "Adam"         # Matches the Colab notebook (Adam, not AdamW)
  weight_decay: 0.0         # No weight decay (as in the notebook)
  gradient_clip: 0.0        # 0.0 = disabled (as in the notebook)
  amp: false                # Disabled (as in the notebook)
  label_smoothing: 0.0      # 0.0 = plain CrossEntropyLoss (as in the notebook)
  mixup_alpha: 0.0          # 0.0 = disabled (as in the notebook)
  main_metric: "accuracy"
  seed: 42
  debug: false              # Run on a few batches

# ------------------------------------------------------------
# Paths  —  Toubkal / UM6P  (experiment: plain_vit_baseline_001)
# ============================================================
# All paths are absolute strings. YAML performs no interpolation.
#
# Workspace root:  /home/amine.aitlaamim-ext/projects/DSCA-ViT
# When starting a new experiment, change experiment_name and update
# all derived paths below.
# ============================================================
paths:
  experiment_name: "plain_vit_baseline_001"

  # Dataset — already present on Toubkal, not in Git
  train_dir:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/train"
  test_dir:   "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/test"

  # Experiment artifacts — outside the Git repository
  experiment_dir:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/ViT-Baseline/plain_vit_baseline_001"
  checkpoint_dir:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/checkpoints/ViT-Baseline/plain_vit_baseline_001"
  log_dir:         "/home/amine.aitlaamim-ext/projects/DSCA-ViT/logs/ViT-Baseline/plain_vit_baseline_001"
  results_dir:     "/home/amine.aitlaamim-ext/projects/DSCA-ViT/results/ViT-Baseline/plain_vit_baseline_001"

  # Generated files — written to experiment_dir, never into the Git repo
  split_indices_path:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/ViT-Baseline/plain_vit_baseline_001/split_indices.npz"