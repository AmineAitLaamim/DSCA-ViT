# ============================================================
# DSCA-ViT v3 Configuration
# ============================================================

model:
  backbone: "vit_base_patch16_224"
  pretrained: true
  num_classes: 4
  split_after: 9
  hidden_channels: 32
  interaction_hidden_dim: 192
  adapter_final_scale: 0.1
  coarse_size: 112
  spatial_bias_beta: 1.0
  spatial_bias_gamma: 0.1
  classifier_dropout: 0.1

# Training-only stain-domain augmentation.
# Implemented in the training dataset transform pipeline
# (NOT inside the model) so train/eval separation is explicit.
# Validation and test pipelines never include it.
stain_augmentation:
  enabled: true
  probability: 0.5
  concentration_range: [0.85, 1.15]   # H and DAB OD concentration multipliers
  brightness_range: [0.9, 1.1]        # RGB brightness, pre-deconvolution
  contrast_range: [0.9, 1.1]          # RGB contrast, pre-deconvolution

dataset:
  name: "HER2-IHC-40x"
  image_size: 224
  val_fraction: 0.1
  val_seed: 42

stage1:
  epochs: 4
  input_lr: 2.0e-4
  fusion_lr: 2.0e-4
  classifier_lr: 1.0e-5

stage2:
  epochs: 6
  input_lr: 1.0e-4
  existing_lr: 5.0e-5
  fusion_lr: 2.0e-4
  classifier_lr: 1.0e-4

stage3:
  epochs: 20
  vit_lr: 1.0e-5
  existing_lr: 5.0e-5
  input_lr: 1.0e-4
  fusion_lr: 1.0e-4
  classifier_lr: 1.0e-4

training:
  # v3 runs 2 scales x 2 stains through the shared ViT per step, so
  # activations for both scales stay alive until backward (~2x v2 memory).
  # Reduced from 32 to 16 so v3 fits on the T4 (14.56 GiB) like v2 did.
  batch_size: 16
  optimizer: "AdamW"
  weight_decay: 0.05
  gradient_clip: 1.0
  amp: false

paths:
  data_root: "/content/HER2_Dataset"
  checkpoint_root: "/content/drive/MyDrive/HER2_Checkpoints"
  experiment_name: "DSCA_ViT_v3"
  # The v2 checkpoint whose preserved modules (encoder, cross_attention,
  # refinement, classifier) are loaded into v3.
  v2_checkpoint: "/content/drive/MyDrive/HER2_Checkpoints/DSCA_ViT_v2/best_stage3.pt"

seed: 42