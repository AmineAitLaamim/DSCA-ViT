# ============================================================
# DSCA-ViT Configuration
# Dual-Stain Cross-Attention Vision Transformer
# ============================================================

# ------------------------------------------------------------
# Model Architecture
# ------------------------------------------------------------

model:
  backbone: "vit_base_patch16_224"
  pretrained: true
  num_classes: 4
  split_after: 9                    # Cross-attention after block 9
  proj_init: "repeat"               # 1->3 projection initialization
  spatial_bias_beta: 1.0            # Self-correspondence bonus
  spatial_bias_gamma: 0.5           # Distance penalty scale
  classifier_dropout: 0.1

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------

dataset:
  name: "HER2-IHC-40x"
  classes:
    - "class_0"
    - "class_1+"
    - "class_2+"
    - "class_3+"
  image_size: 224

# ------------------------------------------------------------
# Training — Stage 1 (Frozen Encoder)
# ------------------------------------------------------------

stage1:
  epochs: 30
  batch_size: 32
  optimizer: "Adam"
  encoder_lr: 0.0                   # Frozen
  new_components_lr: 1.0e-4
  scheduler: "CosineAnnealingLR"
  loss: "CrossEntropyLoss"
  num_workers: 2

# ------------------------------------------------------------
# Training — Stage 2 (Full Fine-tuning)
# ------------------------------------------------------------

stage2:
  epochs: 30
  batch_size: 32
  optimizer: "Adam"
  encoder_lr: 1.0e-5
  new_components_lr: 1.0e-4
  scheduler: "CosineAnnealingLR"
  loss: "CrossEntropyLoss"
  num_workers: 2

# ------------------------------------------------------------
# Paths (Google Colab)
# ------------------------------------------------------------

paths:
  data_root: "/content/HER2_Dataset"
  checkpoint_root: "/content/drive/MyDrive/HER2_Checkpoints"
  experiment_name: "DSCA_ViT"

# ------------------------------------------------------------
# Reproducibility
# ------------------------------------------------------------

seed: 42
