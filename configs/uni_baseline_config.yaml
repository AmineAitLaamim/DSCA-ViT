# ============================================================
# UNI Baseline Configuration — HER2-IHC-40x
# ============================================================
# UNI histopathology foundation model (ViT-L/16, DINOv2,
# mass100k) with a 4-class linear head.
#
# Training protocol matches the proper ViT-B16 baseline:
#   Stage 1: frozen UNI backbone, head-only Adam lr=1e-4 (30 epochs)
#   Stage 2: full fine-tuning, backbone lr=1e-5, head lr=1e-4 (30 epochs)
#
#   - Optimizer: Adam
#   - Weight decay: 0.0
#   - Loss: CrossEntropyLoss (no label smoothing)
#   - Batch size: 32 (per GPU)
#   - AMP: disabled
#   - Gradient clipping: none
#   - Scheduler: CosineAnnealingLR(T_max=stage_epochs), recreated per stage
#
# The split file is LOAD-ONLY (never regenerated):
#   .../plain_vit_baseline_001/split_indices_wsi.npz
#   (train 7283 | val 810 | test 1847, val_fraction=0.10, seed=42)
# ============================================================

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------
model:
  backbone: "vit_large_patch16_224"   # UNI (DINOv2, mass100k)
  image_size: 224
  num_classes: 4

# ------------------------------------------------------------
# Experiment
# ------------------------------------------------------------
experiment:
  name: "uni_baseline_001"
  seed: 42

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------
dataset:
  name: "HER2-IHC-40x"
  classes:
    - "class_0"
    - "class_1+"
    - "class_2+"
    - "class_3+"
  image_size: 224
  val_fraction: 0.10     # must match the shared split file

# ------------------------------------------------------------
# Training — Stages (same protocol as the proper ViT baseline)
# ------------------------------------------------------------
stage1:
  epochs: 30
  lr: 1.0e-4
  freeze: ["backbone"]

stage2:
  epochs: 30
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  freeze: []

# ------------------------------------------------------------
# Training — General
# ------------------------------------------------------------
training:
  batch_size: 32           # per GPU (reduce via config if OOM on A100 80GB)
  num_workers: 8
  optimizer: "Adam"        # matches the proper ViT baseline
  weight_decay: 0.0
  gradient_clip: false     # disabled
  amp: false               # disabled
  label_smoothing: 0.0     # plain CrossEntropyLoss
  mixup_alpha: 0.0         # disabled
  stage1_epochs: 30
  stage2_epochs: 30
  stage1_lr: 1.0e-4
  stage2_backbone_lr: 1.0e-5
  stage2_head_lr: 1.0e-4
  main_metric: "accuracy"
  debug: false

# ------------------------------------------------------------
# Paths — Toubkal / UM6P (experiment: uni_baseline_001)
# ============================================================
# All paths are absolute strings. YAML performs no interpolation.
#
# Workspace root: /home/amine.aitlaamim-ext/projects/DSCA-ViT
# ============================================================
paths:
  data_root: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2"

  # Dataset — already present on Toubkal, not in Git
  train_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/train"
  test_dir:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/test"

  # Experiment artifacts — outside the Git repository
  experiment_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/UNI-Baseline/uni_baseline_001"
  checkpoint_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/checkpoints/UNI-Baseline/uni_baseline_001"
  log_dir:        "/home/amine.aitlaamim-ext/projects/DSCA-ViT/logs/UNI-Baseline/uni_baseline_001"
  results_dir:    "/home/amine.aitlaamim-ext/projects/DSCA-ViT/results/UNI-Baseline/uni_baseline_001"

  # Shared WSI-aware split — LOAD ONLY, never regenerate
  split_indices_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/ViT-Baseline/plain_vit_baseline_001/split_indices_wsi.npz"

  # Local UNI checkpoint — no network calls, no HF downloads
  uni_checkpoint_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/pytorch_model.bin"