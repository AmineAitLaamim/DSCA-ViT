# ============================================================
# UNI-Stain-EarlyFusion Configuration — HER2-IHC-40x
# ============================================================
# UNI histopathology foundation model (ViT-L/16, DINOv2, mass100k)
# modified to accept a 5-channel input [RGB + Hematoxylin + DAB]
# via a replaced patch-embed projection, then FULL fine-tuning
# (Stage 2 unfreezes the entire backbone).
#
# Experiment: uni_stain_earlyfusion_001
# ============================================================

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------
model:
  backbone: "vit_large_patch16_224"   # UNI (DINOv2, mass100k)
  image_size: 224
  num_classes: 4
  in_channels: 5                       # RGB + H + DAB (early fusion)

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------
dataset:
  name: "HER2-IHC-40x"
  classes:
    - "class_0"
    - "class_1+"
    - "class_2+"
    - "class_3+"
  image_size: 224
  val_fraction: 0.10     # must match the shared split file

# ------------------------------------------------------------
# Experiment
# ------------------------------------------------------------
experiment:
  name: "uni_stain_earlyfusion_001"
  seed: 42

# ------------------------------------------------------------
# Training — original UNI baseline recipe (2 stages, no early stop)
# ------------------------------------------------------------
training:
  stage1_epochs: 30
  stage2_epochs: 30
  stage1_lr: 1.0e-4
  stage2_backbone_lr: 1.0e-5
  stage2_head_lr: 1.0e-4
  batch_size: 32           # per GPU
  amp: false               # disabled
  weight_decay: 0.0
  gradient_clip: false     # disabled
  num_workers: 8
  optimizer: "Adam"
  main_metric: "accuracy"
  debug: false

# ------------------------------------------------------------
# Paths — Toubkal / UM6P (experiment: uni_stain_earlyfusion_001)
# ============================================================
# All paths are absolute strings. YAML performs no interpolation.
#
# Workspace root: /home/amine.aitlaamim-ext/projects/DSCA-ViT
# ============================================================
paths:
  data_root: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2"

  # Dataset — already present on Toubkal, not in Git
  train_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/train"
  test_dir:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/test"

  # Experiment artifacts — outside the Git repository
  checkpoint_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/checkpoints/UNI-Stain-EarlyFusion/uni_stain_earlyfusion_001"
  log_dir:        "/home/amine.aitlaamim-ext/projects/DSCA-ViT/logs/UNI-Stain-EarlyFusion/uni_stain_earlyfusion_001"
  results_dir:    "/home/amine.aitlaamim-ext/projects/DSCA-ViT/results/UNI-Stain-EarlyFusion/uni_stain_earlyfusion_001"

  # Shared WSI-aware split — LOAD ONLY, never regenerate
  split_indices_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/ViT-Baseline/plain_vit_baseline_001/split_indices_wsi.npz"

  # Local UNI checkpoint — no network calls, no HF downloads
  uni_checkpoint_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/assets/ckpts/vit_large_patch16_224.dinov2.uni_mass100k/pytorch_model.bin"

  # Self-consistent stain stats — computed by UNI-Stain-EarlyFusion/precompute_stain_stats.py
  stain_stats_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/code/DSCA-ViT/configs/uni_stain_earlyfusion_stain_stats.json"