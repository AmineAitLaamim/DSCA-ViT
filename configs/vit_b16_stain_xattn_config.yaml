# ============================================================
# ViT-B16-Stain-XAttn Configuration — HER2-IHC-40x
# ============================================================
# ViT-B16 fine-tuned on RGB, optionally fusing spatial stain
# (H + DAB) info via GATED cross-attention in the last blocks.
# Zero-init gate => numerically identical to plain ViT-B16 at init.
#
# Experiment: vit_b16_stain_xattn_001
# ============================================================

# ------------------------------------------------------------
# Model
# ------------------------------------------------------------
model:
  backbone: "vit_base_patch16_224"
  cross_attn_layers: [8, 9, 10, 11]   # 0-indexed blocks to insert gated CA
  num_heads: 12
  embed_dim: 768
  num_classes: 4
  image_size: 224

# ------------------------------------------------------------
# Dataset
# ------------------------------------------------------------
dataset:
  name: "HER2-IHC-40x"
  classes:
    - "class_0"
    - "class_1+"
    - "class_2+"
    - "class_3+"
  image_size: 224
  val_fraction: 0.10     # must match the shared split file

# ------------------------------------------------------------
# Experiment
# ------------------------------------------------------------
experiment:
  name: "vit_b16_stain_xattn_001"
  seed: 42

# ------------------------------------------------------------
# Training — matches the plain ViT-B16 baseline exactly (2 stages)
# ------------------------------------------------------------
training:
  stage1_epochs: 30
  stage2_epochs: 30
  stage1_lr: 1.0e-4
  stage2_backbone_lr: 1.0e-5
  stage2_new_components_lr: 1.0e-4
  batch_size: 32           # per GPU
  amp: false               # disabled
  weight_decay: 0.0
  gradient_clip: false     # disabled
  optimizer: "Adam"
  num_workers: 8
  main_metric: "accuracy"
  debug: false

# ------------------------------------------------------------
# Paths — Toubkal / UM6P (experiment: vit_b16_stain_xattn_001)
# ============================================================
# All paths are absolute strings. YAML performs no interpolation.
#
# Workspace root: /home/amine.aitlaamim-ext/projects/DSCA-ViT
# ============================================================
paths:
  data_root: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2"

  # Dataset — already present on Toubkal, not in Git
  train_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/train"
  test_dir:  "/home/amine.aitlaamim-ext/projects/DSCA-ViT/data/HER2/test"

  # Experiment artifacts — outside the Git repository
  checkpoint_dir: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/checkpoints/ViT-B16-Stain-XAttn/vit_b16_stain_xattn_001"
  log_dir:        "/home/amine.aitlaamim-ext/projects/DSCA-ViT/logs/ViT-B16-Stain-XAttn/vit_b16_stain_xattn_001"
  results_dir:    "/home/amine.aitlaamim-ext/projects/DSCA-ViT/results/ViT-B16-Stain-XAttn/vit_b16_stain_xattn_001"

  # Shared WSI-aware split — LOAD ONLY, never regenerate
  split_indices_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/experiments/ViT-Baseline/plain_vit_baseline_001/split_indices_wsi.npz"

  # Self-consistent stain stats — computed by ViT-B16-Stain-XAttn/precompute_stain_stats.py
  stain_stats_path: "/home/amine.aitlaamim-ext/projects/DSCA-ViT/code/DSCA-ViT/configs/vit_b16_stain_xattn_stain_stats.json"